name: Muestra del plano 3D de La Plata

on:
  workflow_dispatch:
    inputs:
      paleta:
        description: "Colores del mapa"
        type: choice
        options: [tilo, noche, ambas]
        default: ambas

permissions:
  contents: read

concurrency:
  group: plano-3d
  cancel-in-progress: false

jobs:
  muestra:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar lo necesario
        run: |
          pip install pillow requests numpy
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Plano guardado de otras corridas
        uses: actions/cache@v4
        with:
          path: datos/laplata/osm_casco.json.gz
          key: osm-casco-v1

      - name: Armar la muestra
        env:
          PALETA: ${{ inputs.paleta }}
        run: |
          if [ "$PALETA" = "ambas" ]; then
            python fabrica/plano3d.py --muestra --paleta tilo
            python fabrica/plano3d.py --muestra --paleta noche
          else
            python fabrica/plano3d.py --muestra --paleta "$PALETA"
          fi

      - name: Subir video, GIF y cuadros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plano3d
          path: out/plano3d/
          retention-days: 7
