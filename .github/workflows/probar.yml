name: Probar conexiones

# Botón para revisar en un minuto si Instagram, Facebook y YouTube están bien conectados.
# NO publica nada. Se usa desde Actions → "Probar conexiones" → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Probar Instagram, Facebook y YouTube (no publica nada)
        run: python -m fabrica.main probar
