name: Publicación diaria

on:
  schedule:
    # Pide un aviso cada 30 minutos, de 7:07 a 23:37 (hora de Argentina). GitHub en la práctica avisa cada
    # 2 o 3 horas: con el primer aviso de las 5 horas previas al horario arma el video y espera hasta la hora.
    # El horario de cada día se cambia en config.json → "horarios" (y el del 2º video en turnos.json).
    - cron: "7,37 10-23 * * *"
    - cron: "7,37 0-2 * * *"
  workflow_dispatch:
    inputs:
      serie:
        description: "Forzar una serie (libro, plata, economia, autor, monotributo = impuestos, historias, viral, mito). Vacío = la del día"
        required: false
        default: ""
      publicar:
        description: "¿Publicar en las redes? (si no, solo genera y lo podés ver acá)"
        type: boolean
        default: true
      turno:
        description: "Turno: 1 = el video de siempre, 2 = el segundo del día (series de turnos.json)"
        type: choice
        options: ["1", "2"]
        default: "1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fabrica
  cancel-in-progress: false

jobs:
  reloj:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      si: ${{ steps.toca.outputs.si }}
      turno: ${{ steps.toca.outputs.turno }}
    env:
      TURNO_MANUAL: ${{ inputs.turno }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}  # siempre la última versión (con el historial de hoy al día)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - id: toca
        name: ¿Toca publicar ahora?
        run: python -m fabrica.main toca

  fabricar:
    needs: reloj
    if: needs.reloj.outputs.si == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350   # puede quedar esperando hasta 5 horas la hora exacta de publicar
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SERIE: ${{ inputs.serie }}
      TURNO: ${{ needs.reloj.outputs.turno }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      SUPADATA_KEY: ${{ secrets.SUPADATA_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_FB_TOKEN: ${{ secrets.IG_FB_TOKEN }}
      IG_FB_ID: ${{ secrets.IG_FB_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}  # siempre la última versión (con el historial de hoy al día)

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Modelo de Whisper (para sincronizar subtítulos) en caché
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-v1

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
          pip install -q -r requirements.txt
          mkdir -p fonts
          for f in ofl/anton/Anton-Regular.ttf ofl/poppins/Poppins-Regular.ttf ofl/poppins/Poppins-SemiBold.ttf ofl/poppins/Poppins-Bold.ttf ofl/poppins/Poppins-ExtraBold.ttf ofl/poppins/Poppins-Black.ttf; do
            curl -fsSL -o "fonts/$(basename $f)" "https://github.com/google/fonts/raw/main/$f" || echo "No bajó $f"
          done

      - name: Investigar, escribir y diseñar
        run: python -m fabrica.main generar

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/sitio

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Esperar a que los archivos estén online
        run: python -m fabrica.main online --base-url "${{ steps.deployment.outputs.page_url }}"

      - name: Mandarte el video para revisar
        if: ${{ github.event_name == 'schedule' }}
        run: python -m fabrica.main listo --base-url "${{ steps.deployment.outputs.page_url }}"

      - name: Esperar la hora o tu respuesta (puede tardar unas horas, es normal)
        id: espera1
        if: ${{ github.event_name == 'schedule' }}
        run: python -m fabrica.main esperar

      # ---- Vuelta 2: rehacer con tus cambios (si los pediste desde «Revisar video») ----
      - name: Rehacer con tus cambios (versión 2)
        if: ${{ steps.espera1.outputs.decision == 'cambios' }}
        run: python -m fabrica.main rehacer

      - if: ${{ steps.espera1.outputs.decision == 'cambios' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/sitio
          name: github-pages-2

      - id: deployment2
        if: ${{ steps.espera1.outputs.decision == 'cambios' }}
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-2

      - name: Esperar a que la versión 2 esté online
        if: ${{ steps.espera1.outputs.decision == 'cambios' }}
        run: python -m fabrica.main online --base-url "${{ steps.deployment.outputs.page_url }}"

      - name: Mandarte la versión 2 para revisar
        if: ${{ steps.espera1.outputs.decision == 'cambios' }}
        run: python -m fabrica.main listo --base-url "${{ steps.deployment.outputs.page_url }}"

      - name: Esperar la hora o tu respuesta (versión 2)
        id: espera2
        if: ${{ steps.espera1.outputs.decision == 'cambios' }}
        run: python -m fabrica.main esperar

      # ---- Vuelta 3: rehacer con tus cambios (si los pediste desde «Revisar video») ----
      - name: Rehacer con tus cambios (versión 3)
        if: ${{ steps.espera2.outputs.decision == 'cambios' }}
        run: python -m fabrica.main rehacer

      - if: ${{ steps.espera2.outputs.decision == 'cambios' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/sitio
          name: github-pages-3

      - id: deployment3
        if: ${{ steps.espera2.outputs.decision == 'cambios' }}
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-3

      - name: Esperar a que la versión 3 esté online
        if: ${{ steps.espera2.outputs.decision == 'cambios' }}
        run: python -m fabrica.main online --base-url "${{ steps.deployment.outputs.page_url }}"

      - name: Mandarte la versión 3 para revisar
        if: ${{ steps.espera2.outputs.decision == 'cambios' }}
        run: python -m fabrica.main listo --base-url "${{ steps.deployment.outputs.page_url }}"

      - name: Esperar la hora o tu respuesta (versión 3)
        id: espera3
        if: ${{ steps.espera2.outputs.decision == 'cambios' }}
        run: python -m fabrica.main esperar --ultima

      - name: Publicar en las redes (o no, si pediste que hoy no salga)
        if: ${{ github.event_name == 'schedule' || inputs.publicar }}
        run: python -m fabrica.main publicar --base-url "${{ steps.deployment.outputs.page_url }}"

      - name: Resumen (sin publicar)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publicar }}
        run: python -m fabrica.main resumen --base-url "${{ steps.deployment.outputs.page_url }}"

      - name: Guardar historial
        if: always()
        run: |
          git config user.name "fabrica-bot"
          git config user.email "fabrica-bot@users.noreply.github.com"
          git add data 2>/dev/null || true
          git add publicaciones 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Publicación $(date +%F) [skip ci]"
          git push || (git pull --rebase && git push)
