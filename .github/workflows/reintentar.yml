name: Reintentar publicación

# Vuelve a subir los videos de los últimos 2 días SOLO en las redes donde fallaron (Instagram, carrusel, Facebook).
# No arma nada nuevo y no repite donde ya salió. Se usa desde Actions → "Reintentar publicación" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      cuales:
        description: "Vacío = todos los que fallaron. O fechas separadas por coma (2026-10-27 = 1º video, 2026-10-27-t2 = 2º)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: reintento
  cancel-in-progress: false

jobs:
  reintentar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CUALES: ${{ inputs.cuales }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_FB_TOKEN: ${{ secrets.IG_FB_TOKEN }}
      IG_FB_ID: ${{ secrets.IG_FB_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Volver a subir lo que falló
        run: python -m fabrica.main reintentar
      - name: Guardar historial
        if: always()
        run: |
          git config user.name "fabrica-bot"
          git config user.email "fabrica-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Reintento de publicación [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase -q && continue
            sleep 5
          done
          exit 1
