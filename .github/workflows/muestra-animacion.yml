name: Muestra de animación (Remotion)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  muestra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: animaciones
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Instalar Remotion
        run: npm install --no-audit --no-fund

      - name: Preparar el navegador que usa Remotion
        run: npx remotion browser ensure || echo "Sigue igual, lo baja al renderizar"

      - name: Armar la muestra de promos (8 segundos)
        run: npx remotion render src/index.ts Promo out/muestra.mp4

      - name: Armar el capítulo de muestra (piezas nuevas)
        run: npx remotion render src/index.ts Explicativo out/capitulo.mp4 --props=muestras/capitulo.json

      - name: Armar los GIF chicos
        run: |
          npx remotion render src/index.ts Promo out/muestra.gif --codec=gif --scale=0.4 --every-nth-frame=2
          npx remotion render src/index.ts Explicativo out/capitulo.gif --codec=gif --scale=0.4 --every-nth-frame=2 --props=muestras/capitulo.json

      - name: Subir video y GIF
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: muestra-animacion
          path: animaciones/out/
          retention-days: 7
